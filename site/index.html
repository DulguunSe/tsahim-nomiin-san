<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Цахим номын сан</title>
  <meta name="description" content="Сурагч, багш нарт зориулсан цахим номын сан">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="config.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/catalog.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Үндсэн агуулга руу шилжих</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3H9a3 3 0 0 1 3 3v15a2.5 2.5 0 0 0-2.5-2.5H3.5A1.5 1.5 0 0 1 2 17Z"/><path d="M22 4.5A1.5 1.5 0 0 0 20.5 3H15a3 3 0 0 0-3 3v15a2.5 2.5 0 0 1 2.5-2.5h6a1.5 1.5 0 0 0 1.5-1.5Z"/></svg>
        </span>
        <span class="brand-text">
          <span class="brand-title">Цахим номын сан</span>
          <span class="brand-sub" data-school-name></span>
        </span>
      </a>
      <nav class="nav" aria-label="Үндсэн цэс">
        <a href="./" class="nav-link active">Номууд</a>
        <a href="admin.html" class="nav-link">Админ</a>
      </nav>
    </div>
  </header>
  <main id="main">
    <section class="hero">
      <div class="container">
        <h1 class="hero-title">Унших номоо хайж олоорой</h1>
        <p class="hero-sub"><span data-school-name></span>-ийн сурагч, багш нарт зориулсан цахим номын сан</p>
        <form id="search-form" class="search" role="search">
          <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" name="q" id="q" placeholder="Номын нэр, зохиогч, түлхүүр үгээр хайх…" aria-label="Ном хайх" autocomplete="off">
          <button type="submit" class="btn btn-accent">Хайх</button>
        </form>
      </div>
    </section>

    <div class="container">
      <nav class="chips" id="chips" aria-label="Ангилал"></nav>

      <div class="toolbar">
        <p class="result-count" id="result-count" aria-live="polite">Ачаалж байна…</p>
        <div class="filters">
          <label class="select-label">
            <span class="visually-hidden">Анги</span>
            <select id="grade"><option value="">Бүх анги</option></select>
          </label>
          <label class="select-label">
            <span class="visually-hidden">Эрэмбэлэх</span>
            <select id="sort"></select>
          </label>
        </div>
      </div>

      <div class="book-grid" id="grid"></div>
      <nav class="pagination" id="pagination" aria-label="Хуудаслалт"></nav>

      <div class="empty" id="empty" hidden>
        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3H9a3 3 0 0 1 3 3v15a2.5 2.5 0 0 0-2.5-2.5H3.5A1.5 1.5 0 0 1 2 17Z"/><path d="M22 4.5A1.5 1.5 0 0 0 20.5 3H15a3 3 0 0 0-3 3v15a2.5 2.5 0 0 1 2.5-2.5h6a1.5 1.5 0 0 0 1.5-1.5Z"/></svg>
        <h2 id="empty-title"></h2>
        <p id="empty-text"></p>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© <span data-year></span> <span data-school-name></span></span>
      <span>Цахим номын сан</span>
    </div>
  </footer>
</body>
</html>
